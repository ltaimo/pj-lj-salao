services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pjlj_salon
      POSTGRES_USER: pjlj
      POSTGRES_PASSWORD: pjlj_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pjlj -d pjlj_salon"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://pjlj:pjlj_dev_password@postgres:5432/pjlj_salon?schema=public
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres-data:
